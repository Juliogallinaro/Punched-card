name: GitHub Pages

# main → produção (raiz do site); dev → /dev/.
# O Pages tem um site só por repositório, então cada deploy monta as duas versões juntas.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          path: prod
      - uses: actions/checkout@v6
        with:
          ref: dev
          path: dev
      - run: sh prod/tools/build-pages.sh prod dev && test -f _site/dev/index.html
      - name: Senha no /dev/ (segredo DEV_PASSWORD)
        env:
          STATICRYPT_PASSWORD: ${{ secrets.DEV_PASSWORD }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then echo "::warning::DEV_PASSWORD não definido: /dev/ fica sem senha"; exit 0; fi
          npx --yes staticrypt@3.5.4 _site/dev/index.html -d _site/dev-lock --short -c false --remember 30 \
            --template-title "Seção de Perfuração · dev" --template-instructions "Versão de teste. Digite a senha." \
            --template-placeholder "Senha" --template-button "Entrar" --template-remember "Lembrar neste navegador" \
            --template-error "Senha errada" --template-color-primary "#33617f" --template-color-secondary "#dfe3dc"
          mv _site/dev-lock/index.html _site/dev/index.html && rm -rf _site/dev-lock
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
