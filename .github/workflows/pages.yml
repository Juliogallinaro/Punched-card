name: GitHub Pages

# main → produção (raiz do site); dev → /dev/.
# O Pages tem um site só por repositório, então cada deploy monta as duas versões juntas.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: prod
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
      - run: sh prod/tools/build-pages.sh prod dev && test -f _site/dev/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
