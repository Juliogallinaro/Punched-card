function finishSales(job){
  const cards=job.cards.filter(c=>c.m.some(x=>x));
  const rows=[],rejected=[];
  cards.forEach((c,i)=>{const r=readCard(c);if(r.err)rejected.push(`Cartão ${pad(i+1,3)}: ${r.err}`);else rows.push(r.v)});
  // conferência com o controle do depto. de vendas
  const exp=[];S.slips.filter(s=>!s.err&&s.status!=='futuro').forEach(s=>s.items.forEach(it=>exp.push({s,it,used:false})));
  const issues=[];let ok=0,bad=0;
  for(const r of rows){
    const e=exp.find(x=>!x.used&&x.s.ped===r.ped&&x.it.cod===r.prod);
    if(!e){const inv=S.slips.find(s=>s.ped===r.ped&&s.err);
      issues.push(inv?`Pedido ${r.ped}: tinha erro e devia ter sido devolvido, mas foi perfurado.`:`Cartão do pedido ${r.ped}, produto ${r.prod}: não bate com nenhum pedido válido.`);bad++;continue}
    e.used=true;const df=[];
    if(r.data!==S.ddmmaa)df.push(`data ${r.data}`);
    if(r.vend!==e.s.vend.cod)df.push(`vendedor ${r.vend} (era ${e.s.vend.cod})`);
    if(r.cli!==norm(e.s.cli))df.push(`cliente "${r.cli}" (era ${norm(e.s.cli)})`);
    if(r['qtd#']!==e.it.qty)df.push(`quantidade ${r['qtd#']} (era ${e.it.qty})`);
    if(r['preco#']!==e.it.price)df.push(`preço ${r['preco#']}¢ (era ${e.it.price}¢)`);
    if(r['total#']!==e.it.total)df.push(`total ${r['total#']}¢ (era ${e.it.total}¢)`);
    if(df.length){bad++;issues.push(`Pedido ${r.ped}, produto ${r.prod}: ${df.join('; ')}.`)}else ok++;
  }
  exp.filter(x=>!x.used).forEach(x=>{bad++;issues.push(`Pedido ${x.s.ped}, produto ${x.it.cod}: não foi perfurado.`)});
  rejected.forEach(r=>{bad++;issues.push(r+' (rejeitado pela tabuladora)')});
  S.slips.filter(s=>s.err&&s.status!=='devolvido').forEach(s=>{if(!rows.some(r=>r.ped===s.ped)){bad++;issues.push(`Pedido ${s.ped} tinha erro e ficou parado em vez de voltar ao vendedor.`)}});
  const control=exp.reduce((a,x)=>a+x.it.total,0);
  // relatório: total final impresso e totais por vendedor
  const finalLine=[...job.lines].reverse().find(l=>/\*\*/.test(l))||'';
  const tabPrinted=Number((finalLine.replace(/CR|\*/g,' ').trim().split(/\s+/).pop()||'').replace(/\D/g,''))||0;
  const keys=job.cards.map(c=>lineOf(c,14).padEnd(14).slice(11,14));let runs=0;keys.forEach((k,i)=>{if(i===0||k!==keys[i-1])runs++});
  const nVend=new Set(keys).size;
  if(rows.length&&runs>nVend){bad++;issues.push(`O relatório saiu com o mesmo vendedor em grupos separados (${runs} grupos para ${nVend} vendedores): o maço não estava classificado por vendedor.`)}
  if(rows.length&&!job.minors){bad++;issues.push('O relatório saiu sem totais por vendedor (comparação ou programa sem fio no painel).')}
  if(!finalLine)issues.push('A 407 não imprimiu o total final.');
  let pts=ok*50-bad*30;const bonus=S.tabBonus||0;pts+=bonus;
  const tab=tabPrinted;
  // cartões-resumo da 514
  let sumOk=0,sumBad=0;const byV0={};rows.forEach(r=>byV0[r.vend]=(byV0[r.vend]||0)+r['total#']);
  P514.stacker.filter(c=>c.m.some(x=>x)).forEach(c=>{const v=lineOf(c,14).slice(11,14),t=Number(lineOf(c,62).slice(54,62).replace(/\D/g,''))||0;if(byV0[v]===t&&t)sumOk++;else sumBad++});
  const sumPts=sumOk*10;pts+=sumPts;
  S.score+=pts;let lampLost=false;if(control!==tab){S.rep--;lampLost=true}
  // dados para a contabilidade
  const byV={};rows.forEach(r=>byV[r.vend]=(byV[r.vend]||0)+r['total#']);
  const total=tab, comm=Object.entries(byV).reduce((a,[v,t])=>a+Math.round(t*((vendBy(v)||{r:0}).r)/100),0), icm=Math.round(total*ICM/100);
  S.sales={rows,rejected,issues,control,tab,ok,bad,pts,bonus,byV,total,comm,icm,cards:cards.length};
  S.sales.report=job.report;S.sales.sumOk=sumOk;S.sales.sumBad=sumBad;
  S.phase='acct';S.acct={runs:0};S.stacker=[];S.trash=0;
  HAND=[];SRT.hopper=[];POCKETS.forEach(p=>SRT.pk[p]=[]);T4.stacker=[];T4.hopper=[];T4.st1=T4.st2=null;P514.stacker=[];T4.job=null;
  RUN=null;M={lvl:SW.progSel,pre:null,card:null,col:0,master:null,lz:'',lock:false,mult:false,latch:null,busy:false,passed:false};
  msg('');renderAll();
  if(S.rep<=0)return gameOver();
  openOv(`<h2>Fechamento das vendas</h2>
    <p>A 407 leu ${cards.length} cartões do seu maço. O Departamento de Vendas mandou a fita de somar com o total dos pedidos válidos do dia.</p>
    <div class="statgrid">
      <div><b>${money(control)}</b><span>Controle de vendas NCr$</span></div>
      <div><b>${money(tab)}</b><span>Total final da 407 NCr$</span></div>
      <div><b style="color:${control===tab?'var(--good)':'var(--bad)'}">${money(tab-control)}</b><span>Diferença</span></div>
      <div><b>${ok}</b><span>Cartões certos</span></div>
    </div>
    ${issues.length?`<div class="issues">${issues.map(i=>`<div class="bad">${esc(i)}</div>`).join('')}</div>`:'<div class="issues"><div class="good">Nenhuma divergência. Maço perfeito.</div></div>'}
    <p>${pts>=0?'+':''}${pts} pontos${bonus?` (inclui ${bonus} de bônus por fechar antes das 17:00)`:''}${sumPts?`; ${sumOk} cartões-resumo certos da 514: +${sumPts}`:''}${sumBad?` (${sumBad} cartões-resumo não conferem)`:''}.${lampLost?' A diferença no fechamento custou uma lâmpada de confiança.':''}</p>
    <p>Agora a contadoria precisa dos lançamentos do dia. O leito da perfuradora foi esvaziado e o alimentador recebeu cartões de lançamento. Vire a chave <b>PROG SEL</b> para TWO (o programa de lançamento) e aperte FEED duas vezes. O relatório da 407 está no cavalete à esquerda; as instruções, na prancheta à direita. Use o relatório como fonte, mesmo que ele tenha erros seus. Depois leve os lançamentos à sala de máquinas: classifique pela CONTA (colunas 10, 9, 8 e 7) e rode na 407 com o painel BALANCETE, terminando com FINAL TOTAL.</p>
    <div class="actions"><button class="btn go" data-ov="toacct">Ir para a contadoria</button></div>`);
}
function readCard(c){const v={};
  for(const f of PROGS[c.prog].fields){if(f.t==='skip')continue;let s='';for(let k=f.s;k<=f.e;k++)s+=chOf(c.m[k]);
    if(f.t==='num'){if(/[^0-9 ]/.test(s))return{err:`campo ${f.n} ilegível ("${s.trim()}")`};v[f.k]=s.replace(/ /g,'0');v[f.k+'#']=Number(v[f.k])}
    else{if(s.includes('▒'))return{err:`campo ${f.n} com perfuração múltipla`};v[f.k]=s.trim().replace(/\s+/g,' ')}}
  return{v}}
function salesReport(){const R=S.sales,d=dayDate(S.day),L=[];
  L.push('FUNDICAO TAMANDUATEI LTDA'.padEnd(36)+'RELATORIO DE VENDAS   '+`${pad(d.getDate(),2)}/${pad(d.getMonth()+1,2)}/68`);
  L.push('');
  L.push('PEDIDO VEND CLIENTE              PROD    QTDE      PRECO          TOTAL');
  L.push('-'.repeat(72));
  const vs=[...new Set(R.rows.map(r=>r.vend))].sort();
  for(const v of vs){
    R.rows.filter(r=>r.vend===v).sort((a,b)=>a.ped.localeCompare(b.ped)).forEach(r=>{
      L.push(r.ped.padEnd(7)+r.vend.padEnd(5)+r.cli.slice(0,20).padEnd(21)+r.prod.padEnd(5)+qtyf(r['qtd#']).padStart(7)+money(r['preco#']).padStart(11)+money(r['total#']).padStart(15))});
    const vv=vendBy(v);
    L.push(('       *  TOTAL DO VENDEDOR '+v+' '+(vv?norm(vv.n):'NAO CADASTRADO')).padEnd(57)+money(R.byV[v]).padStart(15));
    L.push('');
  }
  L.push('-'.repeat(72));
  L.push('      ** TOTAL GERAL'.padEnd(57)+money(R.total).padStart(15));
  L.push('');
  L.push(`CARTOES LIDOS ${R.cards}   ACEITOS ${R.rows.length}   REJEITADOS ${R.rejected.length}`);
  R.rejected.forEach(x=>L.push('  REJEITADO: '+norm(x)));
  return L.join('\n')}

function runBalancete(job){
  const onBed=[M.pre,M.card,M.master].filter(c=>c&&c.m.some(x=>x)).length;
  S.acct.runs++;
  const R=S.sales,exp={'1120':R.total,'3110':-R.total};S.acct.mov=null;
  if(S.day>=2){exp['4210']=R.comm;exp['2140']=-R.comm}
  if(S.day>=3){exp['4110']=R.icm;exp['2120']=-R.icm}
  S.acct.mov={...exp};for(const [k,v] of Object.entries(S.ledgerStart||{}))exp[k]=(exp[k]||0)+v;
  const nOrig=job.cards.filter(c=>c.orig).length;
  const acc={},rej=[];let tD=0,tC=0;
  job.cards.filter(c=>c.m.some(x=>x)).forEach((c,i)=>{const r=readCard(c);
    if(r.err)return rej.push(`CARTAO ${pad(i+1,3)}: ${norm(r.err)}`);const v=r.v;
    if(!(v.conta in ACCOUNTS))return rej.push(`CARTAO ${pad(i+1,3)}: CONTA ${v.conta} NAO EXISTE`);
    if(v.dc!=='D'&&v.dc!=='C')return rej.push(`CARTAO ${pad(i+1,3)}: D/C INVALIDO "${v.dc}"`);
    const a=acc[v.conta]=acc[v.conta]||{D:0,C:0};a[v.dc]+=v['valor#'];if(v.dc==='D')tD+=v['valor#'];else tC+=v['valor#']});
  const keys=[...new Set([...Object.keys(acc),...Object.keys(exp)])].sort();
  const L=['BALANCETE DE VERIFICACAO DO DIA'.padEnd(46)+S.ddmmaa.replace(/(..)(..)(..)/,'$1/$2/$3'),'','CONTA DESCRICAO                    DEBITO        CREDITO   ','-'.repeat(68)];
  let allOk=true;
  for(const k of keys){const a=acc[k]||{D:0,C:0};const ok=(a.D-a.C)===(exp[k]||0);if(!ok)allOk=false;
    L.push(k.padEnd(6)+ACCOUNTS[k].padEnd(22)+money(a.D).padStart(13)+money(a.C).padStart(15)+(ok?'   CONFERE':'   NAO CONFERE'))}
  L.push('-'.repeat(68));
  L.push('TOTAIS'.padEnd(28)+money(tD).padStart(13)+money(tC).padStart(15)+(tD===tC?'   FECHADO':'   DIFERENCA '+money(tD-tC)));
  if(tD!==tC)allOk=false;
  rej.forEach(x=>L.push('REJEITADO '+x));
  if(onBed)L.push(`ATENCAO: ${onBed} CARTAO(OES) PERFURADO(S) FICARAM NA PERFURADORA E NAO PASSARAM NA 407.`);
  if(nOrig){L.push(`ATENCAO: ${nOrig} CARTAO(OES) ORIGINAL(IS) DO ARQUIVO PASSARAM NA 407. USE COPIAS DA 514. -20`);S.score-=20}
  const txt=L.join('\n');
  if(allOk){
    const pts=Math.max(30,150-30*(S.acct.runs-1));S.score+=pts;
    openOv(`<h2>Balancete fechado</h2><h3>Relatório da 407</h3><div class="printout"><pre>${esc(job.report)}</pre></div><h3>Conferência da contadoria</h3><div class="printout"><pre>${esc(txt)}</pre></div>
      <p class="verdict ok">Todas as contas conferem.</p><p>+${pts} pontos pela contabilidade${S.acct.runs>1?` (${S.acct.runs} rodadas)`:''}.</p>
      <p>A 514 perfurou um cartão de <b>saldo novo</b> para cada conta. Leve-os ao arquivo de aço (com os originais de ontem, se ainda estiverem com você) antes de fechar o dia: são o saldo anterior de amanhã.</p>
      <div class="actions"><button class="btn" data-ov="toarq">Ir arquivar os saldos</button><button class="btn go" data-ov="endday">Fechar o dia</button></div>`);
    S.acct.ok=true;
  }else{
    openOv(`<h2>O balancete não confere</h2><h3>Relatório da 407</h3><div class="printout"><pre>${esc(job.report)}</pre></div><h3>Conferência da contadoria</h3><div class="printout"><pre>${esc(txt)}</pre></div>
      <p class="verdict no">Há contas com valor diferente do esperado pela contadoria.</p>
      <p>Pegue o maço no empilhador da 407, devolva-o ao escaninho, tire os cartões errados, perfure os certos e passe de novo pela classificadora e pela 407. Cada nova rodada vale 30 pontos a menos.</p>
      <div class="actions"><button class="btn go" data-ov="close">Corrigir os lançamentos</button><button class="btn warn" data-ov="giveup">Entregar com diferença</button></div>`);
  }
  renderAll();
}
function endDay(acctOk){
  const mov=S.acct.mov||{};for(const [k,v] of Object.entries(mov))S.ledger[k]=(S.ledger[k]||0)+v;
  const filed={};(S.arqNew||[]).forEach(c=>{const n=cardNet(c);if(n)filed[n.k]=(filed[n.k]||0)+n.v});
  const want=Object.fromEntries(Object.entries(S.ledger).filter(([k,v])=>v));
  const arqOk=Object.keys(want).length===Object.keys(filed).length&&Object.entries(want).every(([k,v])=>filed[k]===v);
  if(arqOk){S.score+=20;S.arqNext=S.arqNew}else{S.score-=30;S.arqNext=null}
  S.arqMsg=arqOk?'Saldos novos arquivados e conferidos: +20.':(S.arqNew||[]).length?'Os cartões de saldo novo arquivados não conferem. A contadoria refez à mão: −30.':'Ninguém arquivou os saldos novos. A contadoria perfurou à mão: −30.';
  S.arqNew=[];
  const R=S.sales;const perfect=acctOk&&R.control===R.tab&&R.issues.length===0&&S.acct.runs===1;
  if(!acctOk)S.rep--;
  if(perfect&&S.rep<5)S.rep++;
  saveBest();renderTop();
  if(S.rep<=0)return gameOver();
  openOv(`<h2>Fim do dia ${S.day}</h2>
    <div class="statgrid">
      <div><b>${R.ok}</b><span>Cartões de pedido certos</span></div>
      <div><b>${R.bad}</b><span>Divergências</span></div>
      <div><b>${money(R.tab-R.control)}</b><span>Diferença nas vendas</span></div>
      <div><b>${acctOk?'sim':'não'}</b><span>Balancete fechado</span></div>
      <div><b>${S.arqNext?'sim':'não'}</b><span>Saldos arquivados</span></div>
      <div><b>${S.score}</b><span>Pontos no total</span></div>
    </div>
    <p>${perfect?'Dia perfeito. O chefe da seção acendeu mais uma lâmpada de confiança.':acctOk?'Dia encerrado.':'A contadoria recebeu um balancete que não fecha. Isso custou uma lâmpada de confiança.'}</p>
    <p>${S.arqMsg}</p>
    <p class="note">Amanhã: mais pedidos${S.day+1===2?', um vendedor novo e o cálculo das comissões':S.day+1===3?' e o lançamento do ICM':' e mais pedidos com erro'}.</p>
    <div class="actions"><button class="btn go" data-ov="next">Começar o dia ${S.day+1}</button></div>`);
  S.phase='between';renderTop();
}
function gameOver(){S.phase='over';saveBest();renderTop();
  openOv(`<h2>Transferido para o almoxarifado</h2><p>A chefia perdeu a confiança na Seção de Perfuração no dia ${S.day}. Você terminou com ${S.score} pontos.</p>${best?`<p class="note">Recorde neste navegador: ${best} pontos.</p>`:''}<div class="actions"><button class="btn go" data-ov="restart">Recomeçar do dia 1</button></div>`)}
function saveBest(){if(AUTO.used)return;if(S.score>best){best=S.score;try{localStorage.setItem('perfuracao-recorde',best)}catch(e){}}}

function manualHTML(start){return `<h2>Seção de Perfuração</h2>
  <p>Santo André, março de 1968. Você opera a perfuradora IBM 029 da Fundição Tamanduateí. Os vendedores mandam pedidos escritos à mão; cada item vira um cartão de 80 colunas. No fim do expediente o maço passa pela classificadora e pela contabilizadora da sala de máquinas, e você perfura os lançamentos contábeis do dia.</p>

  </ul>

let HAND=[];

/* ---------- classificadora 083 ---------- */
// bolsos da esquerda para a direita, como na figura 13 do F20-0074: 9 8 7 6 5 4 3 2 1 0 11 12 R
const POCKETS=['9','8','7','6','5','4','3','2','1','0','11','12','R'];
const SORTSEL=['N','Z','A-1','A-2','A-N'];
const SRT={hopper:[],pk:Object.fromEntries(POCKETS.map(p=>[p,[]])),col:14,sel:'N',edit:false,editStop:false,run:false,err:false,timer:null,fed:0};
// padrão de classificação da figura 6 do manual da 083 (cartão de face para baixo, borda 9 primeiro)
function sortPocket(m){m&=~(SRT.sup||0); // teclas de supressão: o furo suprimido não é lido
  const dig=[];for(let d=1;d<=9;d++)if(m>>di(d)&1)dig.push(d);
  const z12=m&1,z11=m>>1&1,z0=m>>2&1,nz=z12+z11+z0;
  const multi=dig.length>1||nz>1;
  const ed=SRT.edit||SRT.editStop;
  const hiDig=dig.length?Math.max(...dig):0; // a escova lê primeiro o 9: o furo mais baixo vence
  const zone=z0?'0':z11?'11':z12?'12':null;   // 0 vem antes de 11 e 12 na leitura
  switch(SRT.sel){
    case 'N':if(!m)return 'R';if(ed&&(multi||dig.length&&nz))return 'R';return hiDig?String(hiDig):zone;
    case 'Z':if(!nz)return 'R';if(ed&&nz>1)return 'R';return zone;
    case 'A-1':if(ed&&multi)return 'R';if(z12&&hiDig&&!z11&&!z0)return String(hiDig);if(z11)return '11';if(z0)return '0';return 'R';
    case 'A-2':if(ed&&multi)return 'R';if((z11||z0)&&hiDig&&!z12)return String(hiDig);return 'R';
    case 'A-N':if(ed&&multi)return 'R';if(hiDig&&!nz)return String(hiDig);if(z0&&!z11&&!z12&&!hiDig)return '0';if(z11)return '11';if(z12)return '12';return 'R';
  }return 'R'}

    const c=SRT.hopper.shift();if(!c){SRT.run=false;msg('Classificadora parada: o alimentador esvaziou.');renderMachines();return}

    const multi=(()=>{const m=c.m[SRT.col-1];let n=0;for(let r=0;r<12;r++)n+=m>>r&1;return n>1})();
    SRT.pk[p].push(c);SRT.fed++;if(SRT.fed%3===0)tone('click');
    if(p==='R'&&SRT.editStop&&multi){SRT.run=false;SRT.err=true;buzz('Erro de edição: cartão com perfuração múltipla foi para o bolso R. Aperte STOP-RESET e START.');renderMachines();return}

/* ---------- arquivo de saldos e reprodutora 514 (reprodução e gangpunch) ---------- */
const SALDO0={'1120':1843760,'3110':-1843760}; // saldos até 29/02/68
function saldoCard(conta,v,ddmmaa){const c=newCard(2);

function prevDDMMAA(){const d=dayDate(S.day);d.setDate(d.getDate()-1);while(d.getDay()%6===0)d.setDate(d.getDate()-1);return pad(d.getDate(),2)+pad(d.getMonth()+1,2)+'68'}

function formHead(id){const f=FORMS[id]||FORMS.livre;
  return f.title?[f.title+'   '+S.ddmmaa.replace(/(..)(..)(..)/,'$1/$2/$3'),'',(()=>{const a=Array(72).fill(' ');f.head.forEach(([p,t])=>t.split('').forEach((ch,i)=>a[p-1+i]=ch));return a.join('').trimEnd()})(),'-'.repeat(72)]:[]}
function ensureJob(){if(!T4.job||T4.job.done){T4.job={panel:T4.panel.id,cards:[],lines:[],done:false,minors:0};T4.paper=formHead(T4.panel.id).slice()}}

/* resolução de sinais pela fiação */
let ADJ=null;
function adj(){if(ADJ)return ADJ;const w=T4.panel?T4.panel.wires:[];
  ADJ=new Map();const add=(a,b)=>{if(!ADJ.has(a))ADJ.set(a,[]);ADJ.get(a).push(b)};w.forEach(([a,b])=>{add(a,b);add(b,a)});return ADJ}
function srcVal(h,X,seen){const p=h.split('.');
  switch(p[0]){
    case 'R1':return X.r1?X.r1.m[+p[1]-1]:0;
    case 'R2':return X.r2?X.r2.m[+p[1]-1]:0;
    case 'CC':return X.type==='card'?IMP:0;
    case 'PM':return X.type===p[1]?IMP:0;
    case 'FT':return X.type==='final'?IMP:0;
    case 'X':{const v=X.cx&&X.cx[p[1]];return v?v[+p[2]-1]:0}
    case 'PN':return X.sel[p[1]]?0:valAt(`PC.${p[1]}.${p[2]}`,X,seen);
    case 'PT':return X.sel[p[1]]?valAt(`PC.${p[1]}.${p[2]}`,X,seen):0;
    case 'DS':{const v=valAt('DC.'+p[1],X,seen);return v>>DSROWS.indexOf(p[2])&1?IMP:0}
    case 'CX':{if(X.type!=='card')return 0;const a=valAt('CA.'+p[1],X,seen)&~IMP,b=valAt('CB.'+p[1],X,seen)&~IMP;return a!==b?IMP:0}
    case 'LIST':return p[1]==='OFF'?IMP:0;

const isSrc=h=>/^(R1|R2|CC|PM|FT|X|PN|PT|DS|CX)\./.test(h)||h==='LIST.OFF';
function valAt(h,X,seen=new Set()){if(seen.has(h))return 0;seen.add(h);let v=0;for(const o of adj().get(h)||[])if(isSrc(o))v|=srcVal(o,X,seen);return v}
const listOff=()=>(adj().get('LIST')||[]).includes('LIST.OFF');
function ctrMasks(v,size){const neg=v<0,s=String(Math.abs(v)%10**size).padStart(size,'0');let lead=true;
  const a=s.split('').map((ch,i)=>{if(ch!=='0'||i===size-1)lead=false;return lead?0:MASK[ch]});if(!v)a.fill(0);a.neg=neg;return a} // zero print control: total zerado não imprime
function entryAmount(k,X){let s='';for(let p=1;p<=CSIZE[k];p++){const d=digOf(valAt(`E.${k}.${p}`,X)&~IMP);s+=d<0?'0':d}return Number(s)}

/* um ciclo da 407: 'card' (cartão na 2ª leitura), 'MIN'/'INT'/'MAJ' (programa) ou 'final' */
function cycle407(type){
  const X={type,r1:T4.st1,r2:T4.st2,sel:{},cx:{}};
  if(type==='card'){const P={type:'card',r1:T4.st2,r2:T4.st2,sel:{},cx:{}}; // seletores pegos pela 1ª leitura deste mesmo cartão
    for(let i=1;i<=5;i++){const x=valAt('PX.'+i,P),d=valAt('PD.'+i,P);X.sel[i]=!!((x&2)||(x&IMP)||d)}}
  const plus={},minus={},rr={};
  for(const [k] of CTRS){plus[k]=!!valAt('PL.'+k,X);minus[k]=!!valAt('MI.'+k,X);rr[k]=!!valAt('RR.'+k,X)}
  for(const [k,n] of CTRS)if(rr[k])X.cx[k]=ctrMasks(T4.ctr[k],n);
  const amt={};for(const [k] of CTRS)if(plus[k]||minus[k])amt[k]=entryAmount(k,X);
  for(const [k,n] of CTRS)if(amt[k]!==undefined&&type==='card'&&!X.cx[k])X.cx[k]=ctrMasks(minus[k]&&!plus[k]?-amt[k]:amt[k],n);
  for(const [k,n] of CTRS){if(amt[k]!==undefined){if(plus[k])T4.ctr[k]+=amt[k];if(minus[k])T4.ctr[k]-=amt[k];T4.ctr[k]%=10**n}if(rr[k])T4.ctr[k]=0}
  // impressão
  const off=listOff();let line=null;
  if(type!=='card'||!off){line=Array(120).fill(' ');let lastCP=-1,neg=false;
    const showPR=type==='card'?!off:off;

      const c=valAt('CP.'+n,X)&~IMP;if(c){line[n-1]=chOf(c);lastCP=n}}
    if(type!=='card'&&lastCP>=0){for(const [k] of CTRS)if(X.cx[k]&&X.cx[k].neg)neg=true;
      const sym=(neg?'CR':'')+(type==='MIN'?'*':type==='INT'?'**':type==='MAJ'?'***':'**');sym.split('').forEach((ch,i)=>{if(lastCP+i<120)line[lastCP+i]=ch})}
    line=line.join('').replace(/\s+$/,'')}
  // perfuração resumida
  if(type!=='card'&&valAt('SP.START',X)){
    if(!P514.on||!P514.cable)log('A 407 pediu perfuração resumida, mas a 514 está desligada ou sem o cabo.','bad');
    else if(!P514.hopper){T4.light.feed=true;T4.stopReq=true;log('A 514 ficou sem cartões em branco: luz CARD FEED STOP na 407.','bad')}

  return {line,X}}
function printLine(s){T4.paper.push(s);if(T4.job)T4.job.lines.push(s);T4.printT=performance.now()}
function feedStep(){ // um ciclo de máquina
  if(T4.st2){const r=cycle407('card');if(r.line!==null)printLine(r.line);T4.job.cards.push(T4.st2);
    let lv=valAt('PS.MAJ',r.X)?3:valAt('PS.INT',r.X)?2:valAt('PS.MIN',r.X)?1:0;
    if(!T4.st1){const A=adj();lv=(A.get('PS.MAJ')||[]).length?3:(A.get('PS.INT')||[]).length?2:(A.get('PS.MIN')||[]).length?1:0} // último cartão: totais de todos os níveis ligados
    const progs=['MIN','INT','MAJ'].slice(0,lv);
    for(const t of progs){const q=cycle407(t);if(q.line!==null)printLine(q.line);if(t==='MIN')T4.job.minors++}
    if(lv>=2)printLine('');
    T4.stacker.push(T4.st2);T4.st2=null}
  T4.st2=T4.st1;T4.st1=T4.hopper.shift()||null}

  if(!T4.hopper.length&&!T4.st1&&!T4.st2)return buzz('Não há cartões no alimentador da 407.');
  ensureJob();const runout=!T4.hopper.length;T4.run=true;T4.stopReq=false;tone('rel');

    if(!T4.st1&&!T4.st2&&!T4.hopper.length){T4.run=false;msg(T4.finalSw?'Máquina vazia. Aperte FINAL TOTAL para imprimir o total final.':'Máquina vazia. A chave FINAL TOTAL está desligada.');renderMachines();return}
    feedStep();tone('click');renderMachines(true);T4.timer=setTimeout(tick,400)}; // 150 cartões por minuto

/* ---------- piloto automático: faz o dia inteiro sozinho, explicando cada passo ---------- */
const AUTO={on:false,speed:.6,used:false,tutor:false,boost:1,wait:null};
const SPEEDS=[[.35,'bem devagar'],[.6,'devagar'],[1,'normal'],[2.5,'rápido']];
const aSleep=ms=>new Promise((res,rej)=>{const t0=performance.now();const f=()=>{if(!AUTO.on)return rej('parado');if(performance.now()-t0>=ms/(AUTO.speed*AUTO.boost))return res();setTimeout(f,20)};f()});
async function aUntil(fn,max=900000){const t0=performance.now();while(!fn()){if(!AUTO.on)throw 'parado';if(performance.now()-t0>max)throw 'tempo esgotado';await new Promise(r=>setTimeout(r,40))}}
async function aIdle(){await aUntil(()=>!M.busy)}
// legenda: o que a operadora está fazendo e por quê
async function aSay(step,txt,extra=0){const n=$('#narr');n.hidden=false;
  const wait=AUTO.tutor; // no tutorial, toda explicação espera o Continuar
  n.classList.toggle('wait',wait);
  n.innerHTML=`<b>${esc(step)}</b><span>${txt}</span>${wait?`<div class="nbtn"><button class="btn" data-nx="quit">Sair do tutorial</button><button class="btn go" data-nx="go">Continuar ▸</button></div>`:''}`;
  if(!wait)return aSleep(Math.max(2600,txt.replace(/<[^>]+>/g,'').length*48)+extra).then(hideTap);
  if(false)return aSleep(Math.max(2600,txt.replace(/<[^>]+>/g,'').length*48)+extra);
  await new Promise((res,rej)=>{AUTO.wait={res,rej};$('#narr [data-nx="go"]').focus()});AUTO.wait=null;n.classList.remove('wait');n.hidden=true;hideTap();await aSleep(250)}
$('#narr').addEventListener('click',e=>{const a=e.target.closest('[data-nx]')?.dataset.nx;if(!a||!AUTO.wait)return;
  if(a==='go')AUTO.wait.res();else{AUTO.on=false;AUTO.wait.rej('parado')}});
window.addEventListener('keydown',e=>{if(!AUTO.on||!e.isTrusted)return; // durante o automático o teclado é dela
  e.preventDefault();e.stopImmediatePropagation();if(AUTO.wait&&(e.key==='Enter'||e.key===' '))AUTO.wait.res();else if(AUTO.wait&&e.key==='Escape'){AUTO.on=false;AUTO.wait.rej('parado')}},true);

      await aSay('ICM na Summa',`${ICM}% de ${money(R.total)}: digito o total com um zero a mais (×10) e somo, depois somo o total mais 5 vezes. Total ∗ = ${R.total*15}; duas casas a menos dá NCr$ ${money(R.icm)}.`);
      await aSumma([[String(R.total)+'0',null],...[...Array(5)].map(()=>[R.total,null]),[null,'T']])}
    calcOn(false);
    await aView('teclado',1400);aPoint(V.sw.progSel.g,'PROG SEL: TWO');
    await aSay('PROG SEL em TWO','O mesmo cartão-programa tem dois programas: o 1 nas linhas de cima (pedido) e o 2 nas de baixo (lançamento). Viro PROG SEL para TWO.');
    await aSetSwitches(2);await aView('mesa',1200);await aFeedTwo();await aDateIfLocked();
    let first=true;
    for(const [ac,dc,v,h] of L){await aView('mesa',300);
      await aSay('Lançamento',`Conta ${ac} (${ACCOUNTS[ac]}) a ${dc==='D'?'débito':'crédito'}, NCr$ ${money(v)}, histórico ${h}.${first?' A DATA (col. 1–6) já veio duplicada; a letra D ou C fica na coluna 11, o VALOR tem zero à esquerda e SKIP solta o cartão no fim do histórico.':''}`,first?0:-1000);
      first=false;await aType(ac);await aType(dc);await aType(String(v));await aKey('End');await aType(h);await aKey('Tab');await aIdle()}
    await aView('mesa',1400);aPoint(V.sw.clear.g,'CLEAR');
    await aSay('CLEAR','Lançamentos prontos. CLEAR leva o último cartão ao escaninho.');
    flipSwitch('clear');await aIdle();await aSleep(800);
    await aView('arquivo',1400);
    await aSay('Saldo anterior',`O balancete não é só do dia: cada conta começa com o saldo acumulado até ontem. Esses saldos estão em cartões, aqui no arquivo de aço: ${S.arq.map(c=>{const n=cardNet(c);return `${n.k} ${n.v>0?'D':'C'} ${money(Math.abs(n.v))}`}).join(' e ')}. São do mês passado, até 29/02.`);
    await aSay('Original não sai do arquivo','Se um original se perde ou estraga, a contabilidade inteira fica sem saldo. Por isso eu nunca levo o original para as máquinas: tiro do arquivo, faço uma cópia na reprodutora 514 e devolvo o original.');
    arqTake();await aSleep(900);
    await aView('514',1400);P514.panel='rep';renderMachines();
    await aSay('Reprodutora 514',`A 514 tem duas alimentações: a de leitura, à esquerda, e a de perfuração, à direita, com cartões em branco. No painel REPRODUÇÃO, cada cartão lido é copiado, furo por furo, num cartão em branco. Ponho os ${HAND.length} originais na leitura e aperto START.`);
    handTo('514r');await aSleep(700);start514();await aUntil(()=>!P514.run);await aSleep(800);
    await aSay('Cópias prontas','Os originais caíram no empilhador de leitura e as cópias no de perfuração. A 514 também faz gangpunch (a DATA do primeiro cartão perfurada nos seguintes) e, ligada pelo cabo, a perfuração resumida que a 407 manda.');
    takeFrom('514r');await aSleep(600);await aView('arquivo',1200);arqReturn();
    await aSay('Originais devolvidos','Originais de volta no arquivo. As cópias vão para o escaninho, junto com os lançamentos de hoje.',-600);
    await aView('514',1000);takeFrom('514');await aSleep(500);
    await aView('escaninho',1100);handTo('esc');await aSleep(700);takeFrom('esc');
    await aSay('Para a sala de máquinas','O balancete soma por conta, e agora o maço mistura os lançamentos de hoje com os saldos de ontem. Para cada conta sair com um total só, o maço se classifica pela CONTA.');
    await aSort([10,9,8,7],'a CONTA, colunas 7 a 10');
    if(AUTO.tutor){await aTab('balancete',null);closeOv();
      await aView('514',1200);
      await aSay('Saldo novo',`A 514 perfurou um cartão de saldo novo para cada conta: saldo de ontem mais o movimento de hoje. Amanhã eles serão o saldo anterior.`);
      takeFrom('514');await aSleep(500);await aView('arquivo',1200);arqFile();
      await aSay('Arquivado','Saldos novos no arquivo. É assim que a contabilidade passa de um dia para o outro, e no fim do mês, de um mês para o outro.');
      if(ST!=='all'){await stageEnd();return}
      await aSay('Fim do tutorial','É isso: um dia da Seção de Perfuração. Agora é a sua vez, com o relógio correndo. O Manual (botão no alto) tem tudo o que você viu aqui, e de lá dá para rever o tutorial quando quiser.')}
    else await aTab('balancete','endday')}}
async function toggleAuto(){
  if(AUTO.on){AUTO.on=false;if(AUTO.wait)AUTO.wait.rej('parado');if(!AUTO.tutor)msg('Piloto automático desligado. A partir daqui é com você.');renderAuto();return}
  if(!['sales','tab1','acct'].includes(S.phase))return buzz('O piloto automático trabalha durante o expediente.');
  if(V.editing)return buzz('Feche o cartão-programa antes.');
  if(M.card&&M.col>0&&S.phase!=='tab1')return buzz('Há um cartão perfurado pela metade na perfuradora. Termine-o ou solte com REL antes de ligar o automático.');
  AUTO.on=true;AUTO.used=!AUTO.tutor;closeOv();renderAuto();
  const hold=setInterval(()=>{if(!AUTO.on)return clearInterval(hold);if(S.phase==='sales'&&S.t>T1-3)S.t=T1-3},100);
  if(!AUTO.tutor)log('Piloto automático ligado: a operadora veterana assume a seção e explica cada passo. Com o automático, a pontuação desta partida não vale recorde.');
  try{await autoDay();msg('Piloto automático: dia concluído.')}
  catch(e){if(e!=='parado'){console.error(e);buzz('O piloto automático parou: '+e)}}
  finally{AUTO.on=false;AUTO.boost=1;renderAuto();if(AUTO.tutor)endTutorial()}}
// pedidos fixos do tutorial: um de 1 item, um de 3 itens (DUP), um com erro e um segundo pedido do mesmo vendedor
function tutorialSlips(){
  const it=(cod,qty)=>{const p=CATALOG.find(x=>x.cod===cod);return {cod,d:p.d,qty,price:p.p,total:qty*p.p}};
  const V_=c=>VENDORS.find(v=>v.cod===c);S.nextPed=4217;
  const mk=(id,vend,cli,items,arrive,err)=>({id,ped:pad(S.nextPed++,5),vend:V_(vend),cli,items,err:err||null,arrive,status:id?'futuro':'bandeja',flag:null,fresh:!id});
  const bad=[it('5200',4)];bad[0].total=19400; // 4 × 46,00 = 184,00, não 194,00
  S.slips=[
    mk(0,'101','Ferragens São Jorge',[it('3300',48)],T0),
    mk(1,'102','Mecânica Bandeirante',[it('1040',2000),it('1120',2000),it('2010',2000)],T0+25),
    mk(2,'103','Usina Sta. Rosália',bad,T0+50,'total')];
  S.sel=0;renderAll()}
function startTutorial(st){AUTO.stage=st||'all';if(S.phase==='sales'&&S.day===1&&S.t<=T0+1)tutorialSlips();if(!['all','029','summa'].includes(AUTO.stage))prepStage(AUTO.stage);AUTO.tutor=true;AUTO.speed=.6;toggleAuto()}
function endTutorial(){AUTO.tutor=false;AUTO.used=false;S.started=false;
  S.day=1;S.score=0;S.rep=5;S.nextPed=4217;if(SW.progSel!==1)flipSwitch('progSel');startDay(true);S.paused=true;setView('mesa');renderAll();

const TITLE={on:false,t0:0,raf:0};
function drawTitleCard(cv,cols){const g=cv.getContext('2d'),W=cv.width,H=cv.height;g.clearRect(0,0,W,H);
  const cut=H*.1,px=W*.02,cw=(W-2*px)/80,top=H*.14,rh=(H-top-H*.05)/12;
  g.fillStyle='#efdfaa';g.beginPath();g.moveTo(cut,0);g.lineTo(W,0);g.lineTo(W,H);g.lineTo(0,H);g.lineTo(0,cut);g.closePath();g.fill();
  const text=TITLE.text;
  g.font=`600 ${Math.round(cw*1.05)}px ${getComputedStyle(document.body).getPropertyValue('--mono')||'monospace'}`;g.textAlign='center';
  for(let c=0;c<80;c++){const x=px+c*cw+cw/2;
    if(c<cols&&text[c]&&text[c]!==' '){g.fillStyle='#4a3b1a';g.fillText(text[c],x,top*.62)}
    for(let r=2;r<12;r++){g.fillStyle='rgba(122,90,36,.55)';g.fillText(String(r-2),x,top+r*rh+rh*.72)}}
  g.fillStyle='#22302b';
  for(let c=0;c<Math.min(cols,80);c++){const m=MASK[text[c]]||0;for(let r=0;r<12;r++)if(m>>r&1){const x=px+c*cw+cw*.18,y=top+r*rh+rh*.12;g.fillRect(x,y,cw*.64,rh*.76)}}}
function showTitle(){TITLE.on=true;TITLE.text=('SECAO DE PERFURACAO  FUNDICAO TAMANDUATEI LTDA  SANTO ANDRE 03/1968').padEnd(80);

  el.innerHTML=`<div class="tbox">
    <p class="tkick">Fundição Tamanduateí Ltda. · Santo André, março de 1968</p>
    <h1>Seção de Perfuração</h1>
    <p class="tsub">Os vendedores mandam os pedidos à mão. Você perfura cada item num cartão de 80 colunas na IBM 029, leva o maço à sala de máquinas e fecha a contabilidade antes da sirene das 17:00.</p>
    <canvas id="tcard" width="1480" height="652" aria-label="Cartão perfurado com o nome do jogo"></canvas>
    <div class="tact">
      ${S.started?'<button class="btn go" data-ti="cont">Continuar a partida</button><button class="btn" data-ti="new">Novo jogo</button>':'<button class="btn go" data-ti="start">Começar o expediente</button>'}

  </div>`;
  setView('sala');TITLE.t0=performance.now();
  const cv=$('#tcard');let col=0;
  const step=()=>{if(!TITLE.on)return;drawTitleCard(cv,col);V.yaw=Math.sin((performance.now()-TITLE.t0)/6000)*.55;
    if(col<80)col+=.5;TITLE.raf=requestAnimationFrame(step)};step()}
function hideTitle(){TITLE.on=false;cancelAnimationFrame(TITLE.raf);$('#title').hidden=true;V.yaw=0}
$('#title').addEventListener('click',e=>{const a=e.target.closest('[data-ti]')?.dataset.ti;if(!a)return;

document.addEventListener('keydown',e=>{if(TITLE.on&&$('#ov').hidden&&e.key==='Enter'){e.preventDefault();e.stopImmediatePropagation();($('#title [data-ti="start"]')||$('#title [data-ti="cont"]')).click()}},true);

/* ---------- tutorial: círculo onde a operadora clica ---------- */
function tapXY(x,y,lab,hold){const t=$('#tap');t.style.left=x+'px';t.style.top=y+'px';t.querySelector('span').textContent=lab||'';
  t.hidden=false;t.classList.remove('go','hold');void t.offsetWidth;t.classList.add(hold?'hold':'go');clearTimeout(t._h);if(!hold)t._h=setTimeout(()=>{t.hidden=true},900)}
function hideTap(){const t=$('#tap');t.hidden=true;t.classList.remove('hold')}
function tapWorld(v,lab,hold){if(!AUTO.on||!V.cam)return;V.cam.updateMatrixWorld();const p=v.clone().project(V.cam);if(p.z>1||Math.abs(p.x)>1.02||Math.abs(p.y)>1.02)return;
  const r=V.R.domElement.getBoundingClientRect();tapXY(r.left+(p.x+1)/2*r.width,r.top+(1-p.y)/2*r.height,lab,hold)}
function tapMesh(m,lab,hold){if(!m)return;const v=new THREE.Vector3();m.getWorldPosition(v);tapWorld(v,lab,hold)}
const aPoint=(m,lab)=>tapMesh(m,lab,true);
function tapPanel(name,re,lab,hold){const P=V.panels[name];if(!P)return;const r=P.regions.find(q=>q.label!==undefined&&re.test(q.label));if(!r)return tapMesh(P.mesh,lab,hold);
  const g=P.mesh.geometry.parameters,w=g.width||1,h=g.height||1;
  tapWorld(P.mesh.localToWorld(new THREE.Vector3(((r.x+r.w/2)/P.W-.5)*w,(.5-(r.y+r.h/2)/P.H)*h,.05)),lab,hold)}
// botão TIRAR da linha do cartão i no escaninho (linhas mostradas da mais nova para a mais antiga)
function escRow(i){V.escOff=0;redraw(V.panels.esc);const rs=V.panels.esc.regions.filter(q=>q.label==='TIRAR');return rs[S.stacker.length-1-i]}
function tapRegion(P,r,lab,hold){const g=P.mesh.geometry.parameters;tapWorld(P.mesh.localToWorld(new THREE.Vector3(((r.x+r.w/2)/P.W-.5)*g.width,(.5-(r.y+r.h/2)/P.H)*g.height,.05)),lab,hold)}
function tapDom(el){if(!AUTO.on||!el)return;const r=el.getBoundingClientRect();tapXY(r.left+r.width/2,r.top+r.height/2,'')}
// envolve as ações que o tutorial usa, para mostrar onde é o clique
(function(){const wrap=(name,fn)=>{const o=window[name];window[name]=function(...a){if(AUTO.on)try{fn(...a)}catch(e){}return o.apply(this,a)}};
  const T={takeFrom:{esc:['esc',/MAÇO/],'407':['tab',/EMPILHADOR/],'407h':['tab',/TIRAR DO ALIM/],},
           handTo:{'407':['tab',/ALIMENTADOR|MÃO/],esc:['esc',/DEVOLVER/],}};
  wrap('takeFrom',w=>{if(w==='srt')return tapMesh(V.m.srtHop,'alimentador');if(w==='514')return tapMesh(V.m.p514stk,'empilhador');if(w==='514r')return tapMesh(V.m.p514ro,'empilhador de leitura');const t=T.takeFrom[w];if(t)tapPanel(t[0],t[1])});
  wrap('handTo',w=>{if(w==='514r')return tapMesh(V.m.p514rd,'leitura');if(w==='514p')return tapMesh(V.m.p514hop,'perfuração');if(w==='srt')return tapWorld(new THREE.Vector3(124.5,-30+43,-6.5),'alimentador');const t=T.handTo[w];if(t)tapPanel(t[0],t[1])});
  wrap('flipSwitch',k=>tapMesh(V.sw[k]&&V.sw[k].g,{autoSD:'AUTO SKIP DUP',progSel:'PROG SEL',autoFeed:'AUTO FEED',print:'PRINT',lzPrint:'LZ PRINT',clear:'CLEAR'}[k]));
  wrap('sorterSetCol',c=>tapMesh(V.srtKnob,'coluna '+c));
  wrap('sorterStart',()=>tapMesh(V.srtKeys.start,'START'));
  wrap('sorterSel',()=>tapMesh(V.srtSel,'SORT SELECTION'));
  wrap('takePocket',p=>tapPanel('pockets',new RegExp('^'+p+'$'),'bolso '+p));
  wrap('insertPanel',id=>{const P=V.panels.rack;if(!P)return;redraw(P);
    const k=T4.rack.filter(q=>q!==T4.panel).findIndex(q=>q.id===id),r=P.regions.filter(q=>q.label==='ENCAIXAR')[k];
    if(r)tapRegion(P,r,'ENCAIXAR');else tapMesh(P.mesh,'ENCAIXAR')});
  wrap('start407',()=>tapPanel('tab',/^START$/,'START'));
  wrap('final407',()=>tapPanel('tab',/^FINAL TOTAL$/,'FINAL TOTAL'));
  wrap('start514',()=>tapMesh(V.m514K&&V.m514K.start,'START'));
  wrap('arqTake',()=>tapPanel('arq',/PEGAR ORIG/));wrap('arqReturn',()=>tapPanel('arq',/DEVOLVER/));wrap('arqFile',()=>tapPanel('arq',/ARQUIVAR/));
  wrap('archiveSlip',()=>tapPanel('slip',/ARQUIVAR/));wrap('devolveSlip',()=>tapPanel('slip',/DEVOLVER/));
  wrap('calcPress',t=>tapMesh(V.calcKeys[t],t));
  wrap('sumDir',d=>tapMesh(V.sumKnob,SUMDIR[d][0]+' '+SUMDIR[d][1]));
  wrap('sumPull',()=>tapMesh(V.sumLever&&V.sumLever.children[3],'alavanca'));
})();
const KEYLAB={Home:'FEED',Escape:'ERROR RESET',End:'LEFT ZERO',Tab:'SKIP',Enter:'REL',ArrowRight:'DUP',ArrowUp:'ALPHA',ArrowDown:'NUMERIC',PageUp:'PROG ONE',PageDown:'PROG TWO',Insert:'REG',Backspace:'BACKSPACE'};
const KEYID={Home:'FEED',Escape:'ERR',End:'LZ',Tab:'SKIP',Enter:'REL',ArrowRight:'DUP',ArrowUp:'ALPHA',ArrowDown:'NUM',PageUp:'PROG1',PageDown:'PROG2',Insert:'REG',Backspace:'BKSP'};
function tapKey(k){let id=KEYID[k];
  if(!id){if(/^[A-Z]$/i.test(k))id=k.toUpperCase();else if(/^[0-9]$/.test(k))id=KDIGIT[k]&&KDIGIT[k].id;else if(k===' ')id='SPACE';
    else{const c=k.toUpperCase(),x=K029.find(q=>!q.fn&&(q.a===c||q.n===c));id=x&&x.id}}
  tapMesh(V.keys[id],KEYLAB[k]||(k===' '?'espaço':k))}
